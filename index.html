<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Animated Login</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('login-animated.theme');
          if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="stage">
        <div class="brand">
          <span class="brand-dot">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3l1.6 4.8L18 9.4l-4.4 1.6L12 15.8 10.4 11 6 9.4l4.4-1.6L12 3zM5 17l.8 2.4L8 20l-2.2.6L5 23l-.8-2.4L2 20l2.2-.6L5 17zM18 14l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z"/>
            </svg>
          </span>
          <span class="brand-name">YourBrand</span>
        </div>

        <div class="stage-inner">
          <div class="characters" id="characters">
            <!-- Purple (back, tall) -->
            <div class="char char-purple" id="charPurple">
              <div class="eyes" id="eyesPurple">
                <div class="eye eye-purple" id="purpleEye1"><div class="pupil"></div></div>
                <div class="eye eye-purple" id="purpleEye2"><div class="pupil"></div></div>
              </div>
            </div>

            <!-- Black (middle) -->
            <div class="char char-black" id="charBlack">
              <div class="eyes" id="eyesBlack">
                <div class="eye eye-black" id="blackEye1"><div class="pupil"></div></div>
                <div class="eye eye-black" id="blackEye2"><div class="pupil"></div></div>
              </div>
            </div>

            <!-- Orange (front-left, big dome) -->
            <div class="char char-orange" id="charOrange">
              <div class="dots" id="dotsOrange">
                <div class="dot" id="orangeDot1"></div>
                <div class="dot" id="orangeDot2"></div>
              </div>
            </div>

            <!-- Yellow (front-right, with mouth) -->
            <div class="char char-yellow" id="charYellow">
              <div class="dots" id="dotsYellow">
                <div class="dot" id="yellowDot1"></div>
                <div class="dot" id="yellowDot2"></div>
              </div>
              <div class="mouth" id="yellowMouth"></div>
            </div>
          </div>
        </div>

        <nav class="footer-links">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="#">Contact</a>
        </nav>
      </section>

      <section class="panel">
        <button type="button" class="theme-toggle" id="themeToggle" aria-label="Tema değiştir" title="Tema değiştir">
          <svg id="iconSun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg id="iconMoon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
        <div class="panel-inner">
          <div class="mobile-brand">
            <span class="brand-dot">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 3l1.6 4.8L18 9.4l-4.4 1.6L12 15.8 10.4 11 6 9.4l4.4-1.6L12 3zM5 17l.8 2.4L8 20l-2.2.6L5 23l-.8-2.4L2 20l2.2-.6L5 17zM18 14l1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3z"/>
              </svg>
            </span>
            <span>YourBrand</span>
          </div>

          <header class="panel-head">
            <h1>Welcome back!</h1>
            <p>Please enter your details</p>
          </header>

          <form class="form" id="loginForm" novalidate>
            <label class="field">
              <span>Email</span>
              <input type="email" id="email" name="email" autocomplete="off" placeholder="anna@gmail.com" />
            </label>

            <label class="field">
              <span>Password</span>
              <div class="password-wrap">
                <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" />
                <button type="button" class="toggle-pass" id="togglePass" aria-label="Şifreyi göster">
                  <svg id="iconEye" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                  <svg id="iconEyeOff" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-10-7-10-7a17.81 17.81 0 0 1 4.06-5.06" />
                    <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 10 7 10 7a17.81 17.81 0 0 1-3.17 4.19" />
                    <path d="M14.12 14.12A3 3 0 1 1 9.88 9.88" />
                    <line x1="2" y1="2" x2="22" y2="22" />
                  </svg>
                </button>
              </div>
            </label>

            <div class="row">
              <label class="check">
                <input type="checkbox" id="remember" />
                <span>Remember for 30 days</span>
              </label>
              <a href="#" class="link" id="forgotPass">Forgot password?</a>
            </div>

            <div class="error-box" id="errorBox" hidden>
              Invalid email or password. Please try again.
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">Log in</button>
          </form>

          <button type="button" class="btn-outline">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
              <polyline points="22,6 12,13 2,6" />
            </svg>
            Log in with Google
          </button>

          <p class="signup">Don't have an account? <a href="#" class="link strong">Sign Up</a></p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
